<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    div{
      position: absolute;
    }
    .blue-box {
      background-color: rgb(10, 136, 136);
      width: 500px;
      height: 300px;
      position: relative;
      margin-top:200px;;
      margin-left: 200px;;
      
    }
    .red-circle{
      background-color: red;
      width:200px;
      height:200px;
      border-radius:50%;
      position: absolute;
      top:18%;
      left:30%;
      
    }
  </style>
</head>

<body>
  <div class="blue-box">

    
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
